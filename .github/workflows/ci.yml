name: SmartRestaurant CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  CONFIGURATION: Release

jobs:
  build-and-test:
    name: Build, Test & Quality Gate
    runs-on: windows-latest

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET 8 LTS SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Cache NuGet Packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', 'SmartRestaurant.sln') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore Solution Dependencies
        run: dotnet restore SmartRestaurant.sln

      - name: Build Solution in Release Configuration
        run: dotnet build SmartRestaurant.sln --no-restore --configuration ${{ env.CONFIGURATION }}

      - name: Execute Automated xUnit Unit Tests with Code Coverage
        run: >
          dotnet test SmartRestaurant.Tests/SmartRestaurant.Tests.csproj
          --no-build
          --configuration ${{ env.CONFIGURATION }}
          --collect:"XPlat Code Coverage"
          --results-directory ./TestResults
          --logger "console;verbosity=normal"
          -- DataCollectionRunSettings.DataCollectors.DataCollector.Configuration.Format=cobertura

      - name: Quality Gate Verification (Coverage >= 70%)
        shell: pwsh
        run: |
          Write-Host "=== SmartRestaurant Automated Quality Gate ==="
          $coverageFiles = Get-ChildItem -Path ./TestResults -Filter "coverage.cobertura.xml" -Recurse
          if ($coverageFiles.Count -eq 0) {
            Write-Error "No coverage report generated. Build failed."
            exit 1
          }
          $xmlPath = $coverageFiles[0].FullName
          Write-Host "Inspecting coverage report: $xmlPath"
          [xml]$xml = Get-Content $xmlPath
          $branchRate = [double]$xml.coverage.'branch-rate' * 100
          $lineRate = [double]$xml.coverage.'line-rate' * 100
          Write-Host ("Overall Line Coverage:   {0:N2}%" -f $lineRate)
          Write-Host ("Overall Branch Coverage: {0:N2}%" -f $branchRate)
          if ($branchRate -lt 70.0 -or $lineRate -lt 70.0) {
            Write-Error ("Quality Gate FAILED: Required >= 70% threshold (Line: {0:N2}%, Branch: {1:N2}%)" -f $lineRate, $branchRate)
            exit 1
          }
          Write-Host "Quality Gate Passed: Coverage meets and exceeds 70% threshold."
          Write-Host "All automated xUnit unit tests executed successfully."

      - name: Upload Test & Coverage Results Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-and-coverage
          path: ./TestResults
          retention-days: 14
